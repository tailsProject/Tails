# AWS 배포용 - mysql 서비스 없음(RDS 사용)

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      # RDS 엔드포인트로 교체
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      DB_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Seoul
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-1209600000}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      TOUR_API_KEY2: ${TOUR_API_KEY2:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-dummy}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-dummy}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-dummy}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-dummy}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-tails-firebase-key.json}
      OAUTH2_SUCCESS_REDIRECT_URL: ${OAUTH2_SUCCESS_REDIRECT_URL:-https://mytails.site/oauth2/redirect}
      APP_EMAIL_VERIFY_URL: ${APP_EMAIL_VERIFY_URL:-https://mytails.site/verify-email}
      APP_PASSWORD_RESET_URL: ${APP_PASSWORD_RESET_URL:-https://mytails.site/reset-password}
    volumes:
      - uploads_data:/app/uploads
      # EC2 /opt/tails-config/ 에 미리 배치해둔 실제 설정 파일 (git엔 없음, .example 기반)
      - /opt/tails-config/application.properties:/app/config/application.properties:ro
      - /opt/tails-config/application-prod.properties:/app/config/application-prod.properties:ro
      - /opt/tails-config/tails-firebase-key.json:/app/tails-firebase-key.json:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      # certbot으로 발급한 인증서, EC2에서 letsencrypt가 만든 경로를 그대로 마운트
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  uploads_data:
