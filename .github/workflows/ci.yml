name: CI

# main/dev push·PR 테스트+빌드 확인
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 의존성 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Debug - JDK/mail dependency info
        run: |
          java -version
          ./gradlew -q dependencies --configuration testRuntimeClasspath | grep -i "mail\|autoconfigure" || true
          echo "--- AutoConfiguration.imports (mail 관련 줄만) ---"
          find ~/.gradle -name "spring-boot-autoconfigure-*.jar" | while read -r jar; do
            unzip -p "$jar" META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 2>/dev/null | grep -i mail
          done

      - name: Run tests
        run: |
          echo "MAIL_HOST=[$MAIL_HOST]"
          ./gradlew test --no-daemon --stacktrace --rerun
        env:
          MAIL_HOST: smtp.gmail.com

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/test

      - name: Build Docker image
        run: docker build -t backend-app:ci .
